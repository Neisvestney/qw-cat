name: Build app and upload to release

on:
  push:
    tags: [ 'v*' ]

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      # Bundle file names come from Cargo.toml and the in-app update check compares against package.json,
      # so a tag that doesn't match both would ship mislabeled assets or a permanent update banner
      - name: Check tag matches app version
        run: |
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          package_version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$cargo_version" ] || [ "$TAG" != "v$package_version" ]; then
            echo "::error::Tag $TAG must match src-tauri/Cargo.toml ($cargo_version) and package.json ($package_version)"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}
        shell: bash

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    permissions:
      contents: write
    needs: [ create-release ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-22.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: yarn install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Pointing to the tauri directory for caching
          workspaces: "src-tauri -> target"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # The flatpak manifest points to the .deb assets, which can only be fetched publicly once the release is not a draft
  expose-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ create-release, build-tauri ]

    steps:
      - name: Publish release as prerelease
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: true
            })

  build-and-publish-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            arch: x86_64
          - platform: 'ubuntu-22.04-arm'
            arch: aarch64

    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    needs: [ expose-release ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: yarn install

      - name: Generate flatpak manifest
        run: node ./src-tauri/bundle/render-templates.js remote ${{ github.ref_name }}

      - name: Mark workspace as safe
        run: git config --global --add safe.directory .

      - name: 'Upload flatpak manifest'
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          gh release upload ${{ github.ref_name }} "./src-tauri/bundle/generated/io.github.neisvestney.qw-cat.yml#Flatpak manifest (yml)" --clobber
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: qw-cat-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          manifest-path: ./src-tauri/bundle/generated/io.github.neisvestney.qw-cat.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.arch }}
          verbose: true

      - name: 'Upload flatpak artifact'
        run: |
          gh release upload ${{ github.ref_name }} qw-cat-${{ github.ref_name }}-${{ matrix.arch }}.flatpak --clobber
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ create-release, build-and-publish-flatpak ]

    steps:
      - name: Publish release
        id: publish-release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false,
              make_latest: "true"
            })
